[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-mesh"
version = "1.0.0"
authors = [
  { name="Cybersecurity Architecture Team", email="security@phantommesh.internal" },
]
description = "PhantomMesh: Autonomous Cyber Deception, Active Adversary Tarpit & Threat Intelligence Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
phantom-mesh = "phantom_mesh.cli:main"
